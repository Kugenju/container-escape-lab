apiVersion: v1
kind: Pod
metadata:
  name: cap-sys-admin-container
  namespace: metarget
  annotations:
    container.apparmor.security.beta.kubernetes.io/ubuntu: unconfined
spec:
  containers:
  - name: ubuntu
    image: ubuntu:latest
    imagePullPolicy: IfNotPresent
    securityContext:
      capabilities:
        add: ["SYS_ADMIN"]
    command: [ "/bin/bash", "-c", "--" ]
    args:
    - |
      echo "K8S_LOG_PROBE_BEGIN"
      id
      grep CapEff /proc/1/status || true
      mkdir -p /tmp/mt_test
      if mount -t tmpfs tmpfs /tmp/mt_test; then
        echo "[+] mount tmpfs success"
        umount /tmp/mt_test || true
      else
        echo "[-] mount tmpfs failed"
      fi
      echo "K8S_LOG_PROBE_OK"
      while true; do sleep 30; done
