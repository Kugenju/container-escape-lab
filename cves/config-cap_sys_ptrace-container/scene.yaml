apiVersion: v1
kind: Pod
metadata:
  name: cap-sys-ptrace-container
  namespace: metarget
spec:
  hostPID: true
  containers:
  - name: ubuntu
    image: ubuntu:latest
    imagePullPolicy: IfNotPresent
    securityContext:
      capabilities:
        add: ["SYS_PTRACE"]
    command: [ "/bin/bash", "-c", "--" ]
    args:
    - |
      echo "K8S_LOG_PROBE_BEGIN"
      id
      grep CapEff /proc/1/status || true
      ps -eo pid,comm | head
      echo "K8S_LOG_PROBE_OK"
      while true; do sleep 30; done
