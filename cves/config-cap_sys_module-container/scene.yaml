apiVersion: v1
kind: Pod
metadata:
  name: cap-sys-module-container
  namespace: metarget
spec:
  containers:
  - name: ubuntu
    image: ubuntu:latest
    imagePullPolicy: IfNotPresent
    securityContext:
      capabilities:
        add: ["SYS_MODULE"]
    command: [ "/bin/bash", "-c", "--" ]
    args:
    - |
      echo "K8S_LOG_PROBE_BEGIN"
      id
      grep CapEff /proc/1/status || true
      command -v insmod || true
      command -v modprobe || true
      echo "K8S_LOG_PROBE_OK"
      while true; do sleep 30; done
